services:
  veil:
    build: .
    image: veil:local
    container_name: veil
    restart: unless-stopped
    environment:
      # ── 配置文件引导（部署参数的唯一来源）──
      # 部署参数（Matrix homeserver/room_id、数据目录、LLM 上游映射）由挂载的 TOML 承载。
      # 复制示例并按需修改宿主机 `./veil.toml`：
      #   cp examples/veil.toml ./veil.toml
      # 需覆盖的关键键：[auth].homeserver / [auth].room_id、
      # [storage].data_dir = "/data"、[llm].upstreams."8878"/"8879" 与 [llm].default_upstream。
      - VEIL_CONFIG_FILE=/etc/veil/veil.toml

      # ── Matrix 审批 token（密钥注入；homeserver/room_id 见配置文件）──
      # 可缺省：缺省即关闭 Matrix 通知/审批（启动期 warn），其余功能不受影响。
      - MATRIX_ACCESS_TOKEN=${MATRIX_ACCESS_TOKEN:-}

      # ── 可观测 admin（/_admin）token ──
      # 可缺省：缺省即管理面全 404（启动期 warn）。须独立（不得复用 MATRIX_ACCESS_TOKEN），建议 ≥32 字符。
      - OBSERVABILITY_ADMIN_TOKEN=${OBSERVABILITY_ADMIN_TOKEN:-}

      # ── 三因子认证（强烈建议开启）──
      # VEILCTL_BINARY_HASH 独立生效（置位时拒绝调用方冒用 veilctl 自身哈希的直调；为空时该检查兼容跳过），
      # 与 VEILCTL_SECRET 无联动；两者均为空为兼容模式。
      # - VEILCTL_BINARY_HASH=sha256:abc123...
      # - VEILCTL_SECRET=${VEILCTL_SECRET}

      # ── 无 TPM 硬件的开发机：注释掉下方 devices 两行，并设置 VEIL_ALLOW_MOCK_TPM=1（仅开发）。──
      # - VEIL_ALLOW_MOCK_TPM=1
    ports:
      # 回环三端口（默认仅回环；宿主机端口可经环境变量覆盖，回环绑定语义保持）。
      # Rust 服务在容器内固定监听 8877，三条映射均指向该端口（Host 端口区分调用入口）。
      - "127.0.0.1:${PORT_8877:-8877}:8877"   # 凭据 API
      - "127.0.0.1:${PORT_8878:-8878}:8877"   # LLM 代理入口一
      - "127.0.0.1:${PORT_8879:-8879}:8877"   # LLM 代理入口二
    volumes:
      # 数据目录父卷在前（metrics.sqlite、audit.log 等），tpm/db 子卷在后（不遮蔽）。
      - ${DATA_DIR:-./data}:/data
      # TPM 密封文件（seal.pub + seal.priv）。
      - ${TPM_HOST_PATH:-./data/tpm}:/data/tpm:ro
      # KeePass 数据库（.kdbx + .key）。
      - ${DB_HOST_PATH:-./data/db}:/data/db:ro
      # TOML 配置文件（只读）；配合上方 VEIL_CONFIG_FILE 使用，宿主机 ./veil.toml 须先存在。
      - ./veil.toml:/etc/veil/veil.toml:ro
    devices:
      - /dev/tpm0:/dev/tpm0
      - /dev/tpmrm0:/dev/tpmrm0
