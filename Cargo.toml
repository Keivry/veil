[package]
name = "veil"
version = "0.1.0"
edition = "2024"

# §1 脚手架依赖 pin（与 openspec proposal Cargo 依赖 pin 对应，
# moka 留待 §3，argon2/dashmap/tokio-rusqlite 均不引入）。

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "gzip", "brotli", "deflate", "rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
# 0.9 系（^0.9.3 <0.10），不得跟 0.10；§1 仅落位，§3 才用 OsRng。
rand = "0.9.3"
subtle = "2.6.1"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
regex = "1.13.1"
fancy-regex = "0.19.1"
moka = { version = "0.12.16", features = ["future"] }
# veil-keepass-real：真实 kdbx 后端（KDBX3/4 + keyfile，纯 Rust 无系统依赖）+ 密钥零化。
keepass = { version = "0.13", features = ["save_kdbx4"] }
zeroize = "1"
# §4 轻量流式构造（SSE 帧按需 yield），禁重型运行时依赖。
async-stream = "0.3"
bytes = "1"

[lib]
name = "veil"
path = "src/lib.rs"

[[bin]]
name = "veil"
path = "src/main.rs"
