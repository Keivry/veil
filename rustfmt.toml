# 仓库本地 rustfmt 配置（此前仅存在于开发者 ~/.config/rustfmt/rustfmt.toml，
# 导致 `cargo fmt --check` 依赖机器全局配置、他人/CI 不可复现；此处落库为唯一真源）。
#
# 含 nightly 不稳定选项，故需 nightly rustfmt —— 与 `rust-toolchain.toml`
# 的 channel 声明配套；`unstable_features = true` 明确接受该前提。
unstable_features = true

max_width = 100

group_imports = "StdExternalCrate"
imports_granularity = "One"
imports_layout = "HorizontalVertical"

comment_width = 100
normalize_comments = true
wrap_comments = true

doc_comment_code_block_width = 100
format_code_in_doc_comments = true

condense_wildcard_suffixes = true
use_field_init_shorthand = true

fn_single_line = true

reorder_impl_items = true
